name: Install stable Offerwall v7
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-stable-offerwall-v7.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace looping Offerwall runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<script src="/offerwallgg-integration.js?v=20260910-stable-v6"></script>','<script src="/offerwallgg-stable-v7.js?v=20260910-stable-v7"></script>')
          if 'offerwallgg-stable-v7.js?v=20260910-stable-v7' not in s: raise SystemExit('v7 not installed')
          if 'offerwallgg-integration.js?v=20260910-stable-v6' in s: raise SystemExit('old Offerwall still present')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit v7 runtime chain
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Switch production to one-shot stable Offerwall v7'
            git pull --rebase origin main
            git push origin HEAD:main
          fi