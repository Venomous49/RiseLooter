name: Deploy final RiseLooter rewards
on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'worker-entry.js'
      - 'worker-live-guard.js'
      - 'index.html'
      - 'offerwallgg-stable-v8.js'
      - 'production-recovery-v3.js'
      - 'history-detail-v2.js'
      - '.github/workflows/deploy-final-rewards.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify restored rewards build
        run: |
          grep -q 'handleOfferwallGgMissions' worker.js
          grep -q 'offerwall_mission_completions' worker.js
          grep -q 'xp_per_100_coins:2000' worker.js
          grep -q '20260910-detailed-v82' worker.js
          grep -q 'Missions en cours' offerwallgg-stable-v8.js
          grep -q 'Jeux rémunérés' offerwallgg-stable-v8.js
          grep -q 'headerCoinsEuro' production-recovery-v3.js
          grep -q 'xpHistoryPanel' production-recovery-v3.js
          grep -q 'rlHistoryPanel' production-recovery-v3.js
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Verify production assets
        run: |
          set -e
          curl -fsSL --retry 5 --retry-delay 3 'https://loot-up.marin-iglesias.workers.dev/' -o /tmp/home.html
          curl -fsSL --retry 5 --retry-delay 3 'https://loot-up.marin-iglesias.workers.dev/offerwallgg-stable-v8.js?v=20260910-detailed-v82' -o /tmp/offerwall.js
          curl -fsSL --retry 5 --retry-delay 3 'https://loot-up.marin-iglesias.workers.dev/production-recovery-v3.js?v=20260910-rewards-v34' -o /tmp/recovery.js
          grep -q '20260910-detailed-v82' /tmp/home.html
          grep -q 'Missions en cours' /tmp/offerwall.js
          grep -q 'Jeux rémunérés' /tmp/offerwall.js
          grep -q 'headerCoinsEuro' /tmp/recovery.js
          grep -q 'xpHistoryPanel' /tmp/recovery.js
          grep -q 'rlHistoryPanel' /tmp/recovery.js
