name: Rollback responsive shell only
on:
  push:
    paths:
      - '.github/workflows/rollback-responsive-shell.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore pre-responsive index and keep current feature loaders
        run: |
          git show 4de5bef8af878472ec5bab1232acb74915f3e07f:index.html > index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="/offerwallgg-integration.js?v=20260910-runtime-v4"></script>\\n<script src="/production-recovery-v3.js?v=20260910-runtime-v4"></script>\n<script src="/runtime-stability-v4.js?v=20260910-runtime-v4"></script>'
          new='<script src="/offerwallgg-stable-v8.js?v=20260910-missions-v8"></script>\n<script src="/production-recovery-v3.js?v=20260910-stable-v13"></script>'
          if old not in s:
              raise SystemExit('Expected old runtime block not found; aborting safely')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit surgical rollback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore pre-responsive page shell without removing current features'
          git push
