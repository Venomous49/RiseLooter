name: Production smoke tests
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/production-smoke.yml'
permissions:
  contents: read
concurrency:
  group: production-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-audit --no-fund
          npx playwright install chromium --with-deps
      - name: Isolate production main-thread hang
        shell: bash
        run: |
          cat > /tmp/diagnose.mjs <<'JS'
          import { chromium } from 'playwright';
          const SUPABASE_STUB=`(()=>{const chain=()=>{let p;p=new Proxy({}, {get(_t,k){if(k==='then')return resolve=>Promise.resolve({data:[],error:null}).then(resolve);return()=>p;}});return p};const client={auth:{getSession:async()=>({data:{session:null},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({data:{session:null},error:null}),signUp:async()=>({data:{session:null},error:null}),updateUser:async()=>({data:{},error:null})},from:()=>chain(),rpc:async()=>({data:null,error:null})};window.supabase={createClient:()=>client};})();`;
          const scenarios=[
            ['baseline',[]],
            ['no-offerwall',['offerwallgg-stable-v8.js']],
            ['no-recovery-history',['production-recovery-v3.js','history-detail-v2.js']],
            ['no-runtime-group',['creator-cache-v23.js','safe-ui-bootstrap.js','fixed-stage-home.js','silhouette-stage-locks.js','evolution-test-mode.js','username-guard.js','admin-dashboard.js']],
            ['no-external-runtime',['offerwallgg-stable-v8.js','production-recovery-v3.js','history-detail-v2.js','creator-cache-v23.js','safe-ui-bootstrap.js','fixed-stage-home.js','silhouette-stage-locks.js','evolution-test-mode.js','username-guard.js','admin-dashboard.js']]
          ];
          const browser=await chromium.launch({headless:true});
          for(const [name,blocked] of scenarios){
            const page=await browser.newPage({viewport:{width:1366,height:768}});
            await page.route('https://cdn.jsdelivr.net/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:SUPABASE_STUB}));
            await page.route('https://loot-up.marin-iglesias.workers.dev/**',async r=>{
              const u=r.request().url();
              if(blocked.some(x=>u.includes('/'+x))) return r.fulfill({status:200,contentType:'application/javascript',body:'/* diagnostic block */'});
              return r.continue();
            });
            try{
              await page.goto('https://loot-up.marin-iglesias.workers.dev/?diag='+name+'-'+Date.now(),{waitUntil:'domcontentloaded',timeout:12000});
              await page.waitForTimeout(1800);
              const result=await Promise.race([
                page.evaluate(()=>new Promise(resolve=>setTimeout(()=>resolve('RESPONSIVE'),250))),
                new Promise(resolve=>setTimeout(()=>resolve('HUNG'),4000))
              ]);
              console.log('DIAG',name,result);
            }catch(e){ console.log('DIAG',name,'ERROR',String(e)); }
            await page.close().catch(()=>{});
          }
          await browser.close();
          JS
          cd /tmp && timeout 120s node diagnose.mjs
