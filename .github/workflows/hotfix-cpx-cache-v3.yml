name: Hotfix CPX inline wall cache v3
on:
  push:
    paths:
      - '.github/workflows/hotfix-cpx-cache-v3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force fresh CPX integration asset
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          old='/cpx-integration.js?v=cpx-35504-v2'
          new='/cpx-integration.js?v=cpx-35504-v3-inline-fix'
          if old not in s and new not in s:
              raise SystemExit('Expected CPX script reference not found')
          s=s.replace(old,new)
          s=s.replace("survey-only-restored-v2-cpx-v6-admin","survey-only-restored-v3-cpx-inline-cachefix-admin")
          p.write_text(s)
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Force fresh CPX inline survey wall asset'
          git push
