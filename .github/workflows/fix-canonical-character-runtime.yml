name: Fix canonical gender character runtime

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-canonical-character-runtime.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify stable production runtime contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'offerwallgg-integration.js?v=20260910-stable-v6' index.html
          grep -Fq 'production-recovery-v3.js?v=20260910-stable-v6' index.html
          ! grep -Fq 'runtime-stability-v4.js?v=20260910-v5' index.html
          ! grep -Fq 'runtime-stability-v5.js?v=20260910-v5' index.html
          grep -Fq 'return Math.max(20, Math.ceil(coins * 20));' worker.js
          grep -Fq 'xp_per_100_coins:2000' worker.js
