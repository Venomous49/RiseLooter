name: Fix canonical gender character runtime

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/fix-canonical-character-runtime.yml'

permissions:
  contents: write

concurrency:
  group: fix-canonical-character-runtime
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install production runtime stability v4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Force fresh copies of the three production runtime scripts.
          import re
          s=re.sub(r'/offerwallgg-integration\.js\?v=[^"<]+','/offerwallgg-integration.js?v=20260910-runtime-v4',s)
          s=re.sub(r'/production-recovery-v3\.js\?v=[^"<]+','/production-recovery-v3.js?v=20260910-runtime-v4',s)
          s=re.sub(r'/runtime-stability-v4\.js\?v=[^"<]+','/runtime-stability-v4.js?v=20260910-runtime-v4',s)

          tag='<script src="/runtime-stability-v4.js?v=20260910-runtime-v4"></script>'
          if 'runtime-stability-v4.js' not in s:
              if '</body>' not in s:
                  raise SystemExit('Missing closing body tag')
              s=s.replace('</body>',tag+'\n</body>',1)

          # Ensure the recovery script itself is present too.
          recovery='<script src="/production-recovery-v3.js?v=20260910-runtime-v4"></script>'
          if 'production-recovery-v3.js' not in s:
              s=s.replace('</body>',recovery+'\n</body>',1)

          required=['runtime-stability-v4.js?v=20260910-runtime-v4','production-recovery-v3.js?v=20260910-runtime-v4','offerwallgg-integration.js?v=20260910-runtime-v4']
          for x in required:
              if x not in s:
                  raise SystemExit('Missing invariant: '+x)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit production runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Load runtime stability v4 and refresh production scripts'
          git pull --rebase origin main
          git push origin HEAD:main
