name: Validate creator library

on:
  push:
    paths:
      - 'index.html'
      - 'worker.js'
      - 'fixed-stage-home.js'
      - 'evolution-test-mode.js'
      - 'cpx-integration.js'
      - '01-debutant.webp'
      - '05-debrouillard.webp'
      - '10-chasseur.webp'
      - '15-hustler.webp'
      - '20-pro.webp'
      - '30-elite.webp'
      - '40-cyber-looter.webp'
      - '50-rise-looter.webp'
      - 'female-01-debutant.webp'
      - 'female-05-debrouillard.webp'
      - 'female-10-chasseur.webp'
      - 'female-15-hustler.webp'
      - 'female-20-pro.webp'
      - 'female-30-elite.webp'
      - 'female-40-cyber-looter.webp'
      - 'female-50-rise-looter.webp'
      - 'wrangler.jsonc'
      - '.assetsignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all 16 canonical stage assets exist
        shell: bash
        run: |
          set -euo pipefail
          files=(01-debutant.webp 05-debrouillard.webp 10-chasseur.webp 15-hustler.webp 20-pro.webp 30-elite.webp 40-cyber-looter.webp 50-rise-looter.webp female-01-debutant.webp female-05-debrouillard.webp female-10-chasseur.webp female-15-hustler.webp female-20-pro.webp female-30-elite.webp female-40-cyber-looter.webp female-50-rise-looter.webp)
          for f in "${files[@]}"; do test -s "$f" || { echo "Missing canonical asset: $f"; exit 1; }; done

      - name: Validate fixed-stage production routing
        shell: bash
        run: |
          set -euo pipefail
          grep -q "x-riselooter-creator-source', 'canonical-stage-images'" worker.js
          grep -q "x-riselooter-creator-version', 'base-hq-realesrgan-v2'" worker.js
          grep -q 'fixed-stage-home.js?v=base-hq-realesrgan-v2' worker.js
          grep -q 'evolution-test-mode.js?v=survey-only-2' worker.js
          grep -q 'cpx-integration.js?v=cpx-35504-v1' worker.js
          grep -q "url.pathname === '/api/cpx/postback'" worker.js
          grep -q 'rpc/apply_partner_reward' worker.js
          grep -q 'CPX_SECURITY_HASH' worker.js
          grep -q 'SUPABASE_SERVICE_ROLE_KEY' worker.js
          grep -q 'SUPABASE_URL' worker.js

      - name: Validate Cloudflare static routing
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "loot-up"' wrangler.jsonc
          grep -q '"main": "worker.js"' wrangler.jsonc
          grep -q '"directory": "./"' wrangler.jsonc
          grep -q '"binding": "ASSETS"' wrangler.jsonc
          grep -q '"run_worker_first": true' wrangler.jsonc
          grep -q 'env.ASSETS.fetch(request)' worker.js
          test -s index.html

      - name: Reject legacy personalization routing regressions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'creator-safe-runtime.js' worker.js
          ! grep -q 'hardenCreatorHtml' worker.js
          ! grep -q 'CREATOR_FALLBACK_NEW' worker.js
