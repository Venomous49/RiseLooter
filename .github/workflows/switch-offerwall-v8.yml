name: Switch production to Offerwall v8
# trigger: 2026-09-10 exact-mission-progress
on:
  push:
    paths:
      - '.github/workflows/switch-offerwall-v8.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Switch production runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="/offerwallgg-stable-v7.js?v=20260910-stable-v7"></script>'
          new='<script src="/offerwallgg-stable-v8.js?v=20260910-missions-v8"></script>'
          if old not in s and new not in s: raise SystemExit('stable Offerwall runtime tag not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'offerwallgg-stable-v8.js?v=20260910-missions-v8' index.html
          ! grep -q 'offerwallgg-stable-v7.js' index.html
      - name: Commit v8 switch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable detailed collapsible active missions v8'
          git pull --rebase origin main
          git push origin HEAD:main
