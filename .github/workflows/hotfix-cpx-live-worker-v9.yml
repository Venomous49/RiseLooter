name: Hotfix CPX live worker v9
on:
  push:
    paths:
      - '.github/workflows/hotfix-cpx-live-worker-v9.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch actual deployed worker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker-live-guard.js')
          s=p.read_text()
          old="element.append('<script src=\"/cpx-integration.js?v=cpx-35504-v5-20260823b\" defer onerror=\"setTimeout(function(){var s=document.createElement(\\'script\\');s.src=\\'/cpx-integration.js?v=cpx-35504-v5-fallback-20260823b\\';document.head.appendChild(s)},300)\"></script>',{html:true});"
          new="element.append('<script src=\"/cpx-inline-v9.js?v=20260823-v9\" defer></script>',{html:true});"
          if old not in s:
              raise SystemExit('Expected CPX injection not found in worker-live-guard.js')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit live worker hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker-live-guard.js
          git commit -m 'Use minimal CPX inline runtime in deployed worker'
          git push
