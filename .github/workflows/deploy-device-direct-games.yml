name: Deploy device targeted games
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-device-direct-games.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Safety checks
        run: |
          set -euo pipefail
          grep -q 'offerwallgg-stable-v8.js' index.html
          grep -q 'daily-streak-ui-v1.js' index.html
          grep -q '__RL_OW_DEVICE_FILTER_V2__' offerwall-device-direct-v1.js
          grep -q '__RL_OW_UI_ENHANCE_V12__' offerwall-ui-enhancements-v1.js
          grep -q 'orientation:portrait' offerwall-ui-enhancements-v1.js
          grep -q 'Voir les missions' offerwall-ui-enhancements-v1.js
          grep -q 'loadLeaderboard' leaderboard-recovery-v1.js
          ! grep -Eq 'setInterval|MutationObserver' offerwall-device-direct-v1.js
          ! grep -Eq 'setInterval|MutationObserver' offerwall-ui-enhancements-v1.js
      - name: Wire only cache-busted UI asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'<script src="/offerwall-ui-enhancements-v1\.js\?v=[^"]+" defer></script>','<script src="/offerwall-ui-enhancements-v1.js?v=20260911-v6" defer></script>',s,count=1)
          p.write_text(s)
          PY
          grep -q 'offerwall-ui-enhancements-v1.js?v=20260911-v6' index.html
          grep -q 'offerwall-device-direct-v1.js?v=20260911-v2' index.html
          grep -q 'leaderboard-recovery-v1.js?v=20260911-v1' index.html
          grep -q 'daily-streak-ui-v1.js' index.html
      - name: Commit wiring
        run: |
          git config user.name 'RiseLooter Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Show French missions and portrait coin pot'
          git push
      - name: Deploy Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Verify production
        run: |
          set -euo pipefail
          curl -fsSL 'https://loot-up.marin-iglesias.workers.dev/' -o /tmp/home
          grep -q 'offerwall-ui-enhancements-v1.js?v=20260911-v6' /tmp/home
          grep -q 'offerwall-device-direct-v1.js?v=20260911-v2' /tmp/home
          grep -q 'leaderboard-recovery-v1.js?v=20260911-v1' /tmp/home
          curl -fsSL 'https://loot-up.marin-iglesias.workers.dev/offerwall-ui-enhancements-v1.js?v=20260911-v6' -o /tmp/ui
          grep -q 'orientation:portrait' /tmp/ui
          grep -q 'Télécharger le jeu' /tmp/ui
          grep -q 'Voir les missions' /tmp/ui