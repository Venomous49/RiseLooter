name: Deploy device targeted games
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-device-direct-games.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Safety checks
        run: |
          set -euo pipefail
          grep -q 'offerwallgg-stable-v8.js' index.html
          grep -q 'daily-streak-ui-v1.js' index.html
          grep -q '__RL_OW_DEVICE_DIRECT_V1__' offerwall-device-direct-v1.js
          ! grep -Eq 'setInterval[[:space:]]*\(' offerwall-device-direct-v1.js
          ! grep -Eq 'new[[:space:]]+MutationObserver' offerwall-device-direct-v1.js
      - name: Wire additive launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          tag='<script src="/offerwall-device-direct-v1.js?v=20260911-v1" defer></script>'
          if 'offerwall-device-direct-v1.js' not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          else:
              s=re.sub(r'<script src="/offerwall-device-direct-v1\.js\?v=[^"]+" defer></script>',tag,s,count=1)
          p.write_text(s)
          PY
          grep -q 'offerwall-device-direct-v1.js?v=20260911-v1' index.html
      - name: Commit page wiring
        run: |
          git config user.name 'RiseLooter Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Enable device targeted direct game launch'
          git push
      - name: Deploy Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Verify production
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            curl -fsSL 'https://loot-up.marin-iglesias.workers.dev/' -o /tmp/home
            grep -q 'offerwall-device-direct-v1.js?v=20260911-v1' /tmp/home && break
            sleep 3
          done
          grep -q 'offerwall-device-direct-v1.js?v=20260911-v1' /tmp/home
          curl -fsSL 'https://loot-up.marin-iglesias.workers.dev/offerwall-device-direct-v1.js?v=20260911-v1' -o /tmp/device
          grep -q 'Compatible' /tmp/device
          grep -q 'Commencer' /tmp/device