name: Creator runtime smoke

on:
  push:
    paths:
      - 'worker.js'
      - 'fixed-stage-home.js'
      - 'evolution-test-mode.js'
      - 'cpx-integration.js'
      - '01-debutant.webp'
      - '05-debrouillard.webp'
      - '10-chasseur.webp'
      - '15-hustler.webp'
      - '20-pro.webp'
      - '30-elite.webp'
      - '40-cyber-looter.webp'
      - '50-rise-looter.webp'
      - 'female-01-debutant.webp'
      - 'female-05-debrouillard.webp'
      - 'female-10-chasseur.webp'
      - 'female-15-hustler.webp'
      - 'female-20-pro.webp'
      - 'female-30-elite.webp'
      - 'female-40-cyber-looter.webp'
      - 'female-50-rise-looter.webp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creator-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_ORIGIN: https://loot-up.marin-iglesias.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Wait for canonical stage deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            headers="$(mktemp)"
            if curl -fsS -D "$headers" -o /tmp/public.html "${PUBLIC_ORIGIN}/?ci=${GITHUB_SHA}"; then
              if grep -qi '^x-riselooter-creator-source: canonical-stage-images' "$headers" \
                && grep -qi '^x-riselooter-creator-version: base-hq-realesrgan-v2' "$headers" \
                && grep -q 'fixed-stage-home.js?v=base-hq-realesrgan-v2' /tmp/public.html \
                && grep -q 'evolution-test-mode.js?v=survey-only-2' /tmp/public.html; then
                rm -f "$headers"
                exit 0
              fi
            fi
            rm -f "$headers"
            sleep 5
          done
          echo 'Canonical fixed-stage deployment did not become visible in time.'
          exit 1

      - name: Verify all 16 public stage assets match main
        shell: bash
        run: |
          set -euo pipefail
          files=(01-debutant.webp 05-debrouillard.webp 10-chasseur.webp 15-hustler.webp 20-pro.webp 30-elite.webp 40-cyber-looter.webp 50-rise-looter.webp female-01-debutant.webp female-05-debrouillard.webp female-10-chasseur.webp female-15-hustler.webp female-20-pro.webp female-30-elite.webp female-40-cyber-looter.webp female-50-rise-looter.webp)
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          for f in "${files[@]}"; do
            curl -fsS --retry 3 --retry-delay 2 -o "$tmpdir/$f" "${PUBLIC_ORIGIN}/$f?ci=${GITHUB_SHA}"
            test "$(sha256sum "$f" | awk '{print $1}')" = "$(sha256sum "$tmpdir/$f" | awk '{print $1}')" || { echo "Public asset mismatch: $f"; exit 1; }
          done

      - name: Verify CPX endpoint is server-side and protected
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cpx.json -w '%{http_code}' "${PUBLIC_ORIGIN}/api/cpx/postback")
          test "$code" = '400' || test "$code" = '503'
          grep -Eq 'missing/invalid parameters|CPX secret not configured' /tmp/cpx.json
