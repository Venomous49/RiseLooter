name: Repair full worker and deploy games fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-worker-games-now.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore complete known-good worker
        run: |
          set -euo pipefail
          git show f51de522:worker.js > worker.js
          grep -q 'offerwall_mission_completions' worker.js
          grep -q 'Math.ceil(coins \* 20)' worker.js
          ! grep -q 'worker-full-runtime.js' worker.js
      - name: Use fixed Offerwall build in worker
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          s=s.replace('/offerwallgg-stable-v8.js?v=20260910-detailed-v82','/offerwallgg-stable-v8.js?v=20260911-session-v83')
          p.write_text(s)
          PY
          grep -q '20260911-session-v83' worker.js
          grep -q '__RL_OW_STABLE_V83__' offerwallgg-stable-v8.js
          grep -q "typeof sb!=='undefined'" offerwallgg-stable-v8.js
      - name: Commit repaired worker
        run: |
          git config user.name 'RiseLooter Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add worker.js
          git commit -m 'Restore full worker and serve Offerwall session fix'
          git push
      - name: Deploy repaired build to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Verify production
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 'https://loot-up.marin-iglesias.workers.dev/' -o /tmp/home.html
          curl -fsSL --retry 5 --retry-delay 3 'https://loot-up.marin-iglesias.workers.dev/offerwallgg-stable-v8.js?v=20260911-session-v83' -o /tmp/ow.js
          grep -q '20260911-session-v83' /tmp/home.html
          grep -q '__RL_OW_STABLE_V83__' /tmp/ow.js
          grep -q "typeof sb!=='undefined'" /tmp/ow.js
          grep -q 'Jeux rémunérés' /tmp/ow.js
