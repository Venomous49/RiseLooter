name: Patch targeted surveys layer
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-targeted-surveys.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify restored worker is complete
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < worker.js)" -gt 500
          grep -q 'export default' worker.js
      - name: Deploy restored main to Cloudflare Workers
        shell: bash
        run: npx --yes wrangler@4 deploy
