name: Rebuild approved character masters

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rebuild-reference-masters.yml'
      - '.asset_sources/reference-male-grid.jpg'
      - '.asset_sources/reference-female-grid.jpg'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Crop approved cells without grid seams and upscale conservatively
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path

          W, H = 3072, 4096
          EXPECTED_SHEET = (1536, 1024)
          names = [
              '01-debutant.webp',
              '05-debrouillard.webp',
              '10-chasseur.webp',
              '15-hustler.webp',
              '20-pro.webp',
              '30-elite.webp',
              '40-cyber-looter.webp',
              '50-rise-looter.webp',
          ]

          def build(sheet_path, prefix=''):
              sheet = Image.open(sheet_path).convert('RGB')
              sw, sh = sheet.size
              assert (sw, sh) == EXPECTED_SHEET, (sheet_path, sheet.size)
              cw, ch = sw // 4, sh // 2
              for i, name in enumerate(names):
                  row, col = divmod(i, 4)
                  # The approved 4x2 boards contain thin separator lines. Trim only
                  # those internal seams so no white/grey grid edge gets enlarged.
                  left = col * cw + (1 if col > 0 else 0)
                  top = row * ch + (1 if row > 0 else 0)
                  right = (col + 1) * cw - (1 if col < 3 else 0)
                  bottom = (row + 1) * ch - (1 if row < 1 else 0)
                  crop = sheet.crop((left, top, right, bottom))
                  out = crop.resize((W, H), Image.Resampling.LANCZOS)
                  out = out.filter(ImageFilter.UnsharpMask(radius=1.0, percent=80, threshold=3))
                  target = Path(prefix + name)
                  out.save(target, 'WEBP', quality=94, method=6, exact=True)
                  check = Image.open(target)
                  assert check.size == (W, H), (target, check.size)
                  assert check.format == 'WEBP', (target, check.format)
                  print(target, check.size)

          build('.asset_sources/reference-male-grid.jpg')
          build('.asset_sources/reference-female-grid.jpg', 'female-')
          PY

      - name: Verify all 16 masters exist
        run: |
          set -euo pipefail
          files=(
            01-debutant.webp 05-debrouillard.webp 10-chasseur.webp 15-hustler.webp
            20-pro.webp 30-elite.webp 40-cyber-looter.webp 50-rise-looter.webp
            female-01-debutant.webp female-05-debrouillard.webp female-10-chasseur.webp female-15-hustler.webp
            female-20-pro.webp female-30-elite.webp female-40-cyber-looter.webp female-50-rise-looter.webp
          )
          for f in "${files[@]}"; do
            test -s "$f"
          done
          echo "Validated ${#files[@]} masters at 3072x4096."

      - name: Commit only the 16 canonical image files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            01-debutant.webp 05-debrouillard.webp 10-chasseur.webp 15-hustler.webp \
            20-pro.webp 30-elite.webp 40-cyber-looter.webp 50-rise-looter.webp \
            female-01-debutant.webp female-05-debrouillard.webp female-10-chasseur.webp female-15-hustler.webp \
            female-20-pro.webp female-30-elite.webp female-40-cyber-looter.webp female-50-rise-looter.webp
          if git diff --cached --quiet; then
            echo 'No master changes to commit.'
            exit 0
          fi
          git commit -m 'Replace 16 character masters with approved reference crops'
          git pull --rebase origin main
          git push origin HEAD:main
