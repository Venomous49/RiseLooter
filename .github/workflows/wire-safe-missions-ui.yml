name: Wire safe missions UI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wire-safe-missions-ui.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire-deploy-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Safety baseline
        run: |
          set -euo pipefail
          grep -q 'offerwall_mission_completions' worker.js
          grep -q 'handleOfferwallGgOffers' worker.js
          ! grep -q 'worker-full-runtime.js' worker.js
          grep -q '__RL_OW_STABLE_V83__' offerwallgg-stable-v8.js
          grep -q 'Voir les missions' offerwall-ui-enhancements-v1.js
          grep -q '__RL_DAILY_STREAK_UI_V1__' daily-streak-ui-v1.js
          ! grep -q 'setInterval' daily-streak-ui-v1.js
          ! grep -q 'MutationObserver' daily-streak-ui-v1.js
      - name: Wire streak UI only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          tag='<script src="/daily-streak-ui-v1.js?v=20260911-v1" defer></script>'
          if 'daily-streak-ui-v1.js' not in s:
              if '</body>' not in s: raise SystemExit('body anchor missing')
              s=s.replace('</body>',tag+'\n</body>',1)
          else:
              s=re.sub(r'<script src="/daily-streak-ui-v1\.js\?v=[^"]+" defer></script>',tag,s,count=1)
          p.write_text(s)
          PY
          grep -q 'daily-streak-ui-v1.js?v=20260911-v1' index.html
          grep -q 'offerwall-ui-enhancements-v1.js?v=20260911-v4' index.html
          grep -q 'id="headerCoins"' index.html
          grep -q 'id="missions"' index.html
      - name: Commit page wiring
        run: |
          git config user.name 'RiseLooter Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Show progressive daily streak XP and remove daily challenges UI'
          git push
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Verify production
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            curl -fsSL 'https://loot-up.marin-iglesias.workers.dev/' -o /tmp/home
            if grep -q 'daily-streak-ui-v1.js?v=20260911-v1' /tmp/home; then break; fi
            sleep 3
          done
          grep -q 'daily-streak-ui-v1.js?v=20260911-v1' /tmp/home
          grep -q 'offerwall-ui-enhancements-v1.js?v=20260911-v4' /tmp/home
          curl -fsSL 'https://loot-up.marin-iglesias.workers.dev/daily-streak-ui-v1.js?v=20260911-v1' -o /tmp/streak
          grep -q '25,50,100,150,200' /tmp/streak
          grep -q "getElementById('challenges')" /tmp/streak
