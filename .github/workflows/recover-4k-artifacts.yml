name: Recover completed 4K character artifacts

# Trigger recovery of verified approved-grid artifacts 2026-08-23
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-4k-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install WebP verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          command -v webpinfo

      - name: Download the 16 already-completed 4K artifacts from run 32602292460
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Venomous49/RiseLooter
          run-id: 32602292460
          pattern: asset-*
          path: .recovered-4k
          merge-multiple: true

      - name: Verify recovered artifacts and install at canonical paths
        shell: bash
        run: |
          set -euo pipefail
          files=(
            01-debutant.webp
            05-debrouillard.webp
            10-chasseur.webp
            15-hustler.webp
            20-pro.webp
            30-elite.webp
            40-cyber-looter.webp
            50-rise-looter.webp
            female-01-debutant.webp
            female-05-debrouillard.webp
            female-10-chasseur.webp
            female-15-hustler.webp
            female-20-pro.webp
            female-30-elite.webp
            female-40-cyber-looter.webp
            female-50-rise-looter.webp
          )
          for f in "${files[@]}"; do
            test -s ".recovered-4k/$f" || { echo "Missing recovered artifact: $f"; exit 1; }
            dims=$(webpinfo ".recovered-4k/$f" 2>/dev/null | awk '/Width:/ {w=$2} /Height:/ {h=$2} END {print w"x"h}')
            echo "$f => $dims"
            [ "$dims" = "3072x4096" ] || { echo "Invalid dimensions for $f: $dims"; exit 1; }
            cp ".recovered-4k/$f" "$f"
          done
          rm -f .asset-enhance-all

      - name: Commit recovered 4K masters to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 01-debutant.webp 05-debrouillard.webp 10-chasseur.webp 15-hustler.webp 20-pro.webp 30-elite.webp 40-cyber-looter.webp 50-rise-looter.webp female-01-debutant.webp female-05-debrouillard.webp female-10-chasseur.webp female-15-hustler.webp female-20-pro.webp female-30-elite.webp female-40-cyber-looter.webp female-50-rise-looter.webp
          git add -u .asset-enhance-all || true
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'Recovered assets are already canonical; nothing to commit.'
            exit 0
          fi
          git commit -m 'Install recovered 4K canonical character masters'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Recovery summary
        shell: bash
        run: |
          echo 'Recovered and verified 16 assets at 3072x4096.'
          echo 'The canonical-asset commit triggers the normal Cloudflare deployment workflow using latest main, including current admin code.'
