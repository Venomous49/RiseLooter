name: Deploy RiseLooter runtime to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker-live-guard.js'
      - 'launch-state.js'
      - 'signup-profile.js'
      - 'cpx-integration.js'
      - '.github/workflows/deploy-runtime-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify > /tmp/verify.json
          node -e "const d=require('/tmp/verify.json'); process.exit(d.success?0:1)"
      - name: Deploy current runtime
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy
