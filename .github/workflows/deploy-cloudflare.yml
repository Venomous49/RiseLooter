name: Deploy RiseLooter to Cloudflare

# Stability v14 auth-runtime deployment
on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'index.html'
      - 'creator-cache-v23.js'
      - 'safe-ui-bootstrap.js'
      - 'username-guard.js'
      - 'fixed-stage-home.js'
      - 'silhouette-stage-locks.js'
      - 'production-recovery-v3.js'
      - 'offerwallgg-stable-v8.js'
      - 'history-detail-v2.js'
      - 'evolution-test-mode.js'
      - 'admin-dashboard.js'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply V14 cache keys in deploy workspace
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#safe-ui-bootstrap.js?v=base-hq-realesrgan-v2#safe-ui-bootstrap.js?v=stability-v14#g' worker.js
          sed -i 's#safe-ui-bootstrap.js?v=stability-v13#safe-ui-bootstrap.js?v=stability-v14#g' worker.js || true
          sed -E -i 's#username-guard\.js\?v=[A-Za-z0-9._-]+#username-guard.js?v=stability-v14#g' index.html || true
          grep -F 'safe-ui-bootstrap.js?v=stability-v14' worker.js
      - name: Verify Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify > /tmp/userverify.json
          node -e "const d=require('/tmp/userverify.json'); process.exit(d.success?0:1)"
      - name: Deploy V14 to Cloudflare
        shell: bash
        run: npx --yes wrangler@4 deploy
