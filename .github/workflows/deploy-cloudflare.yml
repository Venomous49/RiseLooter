name: Deploy RiseLooter to Cloudflare

# Stability v15 exact-balance deployment
on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'index.html'
      - 'creator-cache-v23.js'
      - 'safe-ui-bootstrap.js'
      - 'username-guard.js'
      - 'fixed-stage-home.js'
      - 'silhouette-stage-locks.js'
      - 'production-recovery-v3.js'
      - 'offerwallgg-stable-v8.js'
      - 'offerwall-ui-enhancements-v1.js'
      - 'history-detail-v2.js'
      - 'evolution-test-mode.js'
      - 'admin-dashboard.js'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply V15 cache keys in deploy workspace
        shell: bash
        run: |
          set -euo pipefail
          sed -E -i 's#safe-ui-bootstrap\.js\?v=[A-Za-z0-9._-]+#safe-ui-bootstrap.js?v=stability-v15#g' worker.js
          sed -E -i 's#username-guard\.js\?v=[A-Za-z0-9._-]+#username-guard.js?v=stability-v15#g' index.html || true
          grep -F 'safe-ui-bootstrap.js?v=stability-v15' worker.js
      - name: Verify exact balance and Offerwall runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'syncExactBalance' safe-ui-bootstrap.js
          grep -F '/api/offerwallgg/balance' safe-ui-bootstrap.js
          grep -F 'handleOfferwallGgExactBalance' worker.js
          grep -F 'Voir les missions' offerwall-ui-enhancements-v1.js
          grep -F 'RL Coins' offerwall-ui-enhancements-v1.js
          grep -F 'XP=20' offerwall-ui-enhancements-v1.js
          grep -F 'handleOfferwallGgMissions' worker.js
          grep -F 'offerwall_mission_completions' worker.js
          grep -F 'xp_per_100_coins:2000' worker.js
      - name: Verify Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify > /tmp/userverify.json
          node -e "const d=require('/tmp/userverify.json'); process.exit(d.success?0:1)"
      - name: Deploy V15 to Cloudflare
        shell: bash
        run: npx --yes wrangler@4 deploy
