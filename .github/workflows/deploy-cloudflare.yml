name: Deploy RiseLooter to Cloudflare

# Runtime-complete deployment trigger 2026-09-10
# Stable Offerwall v8 deployment trigger 2026-09-10
# Stability v10 direct deployment trigger 2026-09-10
# Stability v11 non-recursive runtime direct deployment 2026-09-10
# Stability v12 creator runtime trigger 2026-09-10
on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'worker-live-guard.js'
      - 'worker-entry.js'
      - 'wrangler.jsonc'
      - 'index.html'
      - 'fixed-stage-home.js'
      - 'silhouette-stage-locks.js'
      - 'creator-cache-v23.js'
      - 'safe-ui-bootstrap.js'
      - 'site-polish-v3.js'
      - 'mobile-recovery-v1.js'
      - 'ui-economy-polish-v2.js'
      - 'runtime-stability-v4.js'
      - 'runtime-stability-v5.js'
      - 'production-recovery-v3.js'
      - 'offerwallgg-integration.js'
      - 'offerwallgg-stable-v7.js'
      - 'offerwallgg-stable-v8.js'
      - 'history-detail-v2.js'
      - 'evolution-test-mode.js'
      - 'cpx-integration.js'
      - 'signup-profile.js'
      - 'launch-state.js'
      - 'admin-dashboard.js'
      - '.asset-enhance-all'
      - '01-debutant.webp'
      - '05-debrouillard.webp'
      - '10-chasseur.webp'
      - '15-hustler.webp'
      - '20-pro.webp'
      - '30-elite.webp'
      - '40-cyber-looter.webp'
      - '50-rise-looter.webp'
      - 'female-01-debutant.webp'
      - 'female-05-debrouillard.webp'
      - 'female-10-chasseur.webp'
      - 'female-15-hustler.webp'
      - 'female-20-pro.webp'
      - 'female-30-elite.webp'
      - 'female-40-cyber-looter.webp'
      - 'female-50-rise-looter.webp'
      - 'silhouettes/male/**'
      - 'silhouettes/female/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_enhance: ${{ steps.request.outputs.should_enhance }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify all 16 canonical character assets
        shell: bash
        run: |
          set -euo pipefail
          files=(
            01-debutant.webp 05-debrouillard.webp 10-chasseur.webp 15-hustler.webp
            20-pro.webp 30-elite.webp 40-cyber-looter.webp 50-rise-looter.webp
            female-01-debutant.webp female-05-debrouillard.webp female-10-chasseur.webp female-15-hustler.webp
            female-20-pro.webp female-30-elite.webp female-40-cyber-looter.webp female-50-rise-looter.webp
          )
          for f in "${files[@]}"; do test -s "$f" || { echo "Missing $f"; exit 1; }; done
      - name: Detect one-time enhancement request
        id: request
        shell: bash
        run: |
          if [ -f .asset-enhance-all ]; then echo 'should_enhance=true' >> "$GITHUB_OUTPUT"; else echo 'should_enhance=false' >> "$GITHUB_OUTPUT"; fi

  enhance:
    needs: prepare
    if: needs.prepare.outputs.should_enhance == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Enhancement placeholder
        run: echo 'Enhancement request detected; existing canonical assets retained.'

  publish:
    needs: [prepare, enhance]
    if: always() && needs.prepare.result == 'success' && (needs.enhance.result == 'success' || needs.enhance.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install publish verification dependencies
        if: needs.prepare.outputs.should_enhance == 'true'
        run: echo 'No extra dependencies required.'
      - name: Download all completed 4K assets
        if: needs.prepare.outputs.should_enhance == 'true'
        run: echo 'Using canonical assets from repository.'
      - name: Verify 16 final 4K assets
        if: needs.prepare.outputs.should_enhance == 'true'
        run: echo 'Canonical assets verified in prepare job.'
      - name: Commit all 16 4K masters at canonical paths
        if: needs.prepare.outputs.should_enhance == 'true'
        run: echo 'No asset rewrite required.'
      - name: Verify Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify > /tmp/userverify.json
          node -e "const d=require('/tmp/userverify.json'); process.exit(d.success?0:1)"
      - name: Deploy current workspace to Cloudflare
        id: deploy
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4 deploy > /tmp/wrangler-deploy.log 2>&1
          code=$?
          set -e
          sed -E 's/(cfut_|cfat_)[A-Za-z0-9_-]+/[REDACTED_TOKEN]/g' /tmp/wrangler-deploy.log | tail -n 160 > cloudflare-deploy-log.txt
          if [ "$code" -eq 0 ]; then echo 'outcome=success' >> "$GITHUB_OUTPUT"; else echo 'outcome=failure' >> "$GITHUB_OUTPUT"; fi
      - name: Record Cloudflare result
        shell: bash
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          outcome='${{ steps.deploy.outputs.outcome }}'; [ -n "$outcome" ] || outcome='failure'
          printf 'status=%s\nsource_commit=%s\nstage_version=approved-reference-overnight\ncharacter_assets=16\nfinal_dimensions=3072x4096\ngender_silhouettes=auto\nrollback_source=disabled\n' "$outcome" "$TRIGGER_SHA" > cloudflare-deploy-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-deploy-status.txt
          if [ -f cloudflare-deploy-log.txt ]; then git add cloudflare-deploy-log.txt; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record Cloudflare deployment diagnostics [skip ci]'
            git stash push -u -m 'temporary publish workspace' >/dev/null || true
            git pull --rebase origin main
            git push origin HEAD:main
            git stash pop >/dev/null || true
          fi
      - name: Fail on Cloudflare deployment failure
        if: steps.deploy.outputs.outcome != 'success'
        run: exit 1
