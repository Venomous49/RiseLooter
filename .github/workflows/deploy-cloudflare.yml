name: Deploy RiseLooter to Cloudflare

# Final verified silhouette deployment trigger 2026-08-23
on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'index.html'
      - 'fixed-stage-home.js'
      - 'safe-ui-bootstrap.js'
      - 'site-polish-v3.js'
      - 'evolution-test-mode.js'
      - 'cpx-integration.js'
      - 'admin-dashboard.js'
      - '.asset-enhance-all'
      - '01-debutant.webp'
      - '05-debrouillard.webp'
      - '10-chasseur.webp'
      - '15-hustler.webp'
      - '20-pro.webp'
      - '30-elite.webp'
      - '40-cyber-looter.webp'
      - '50-rise-looter.webp'
      - 'female-01-debutant.webp'
      - 'female-05-debrouillard.webp'
      - 'female-10-chasseur.webp'
      - 'female-15-hustler.webp'
      - 'female-20-pro.webp'
      - 'female-30-elite.webp'
      - 'female-40-cyber-looter.webp'
      - 'female-50-rise-looter.webp'
      - 'silhouettes/male/**'
      - 'silhouettes/female/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      enhance: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify all 16 canonical character assets
        shell: bash
        run: |
          set -euo pipefail
          files=(01-debutant.webp 05-debrouillard.webp 10-chasseur.webp 15-hustler.webp 20-pro.webp 30-elite.webp 40-cyber-looter.webp 50-rise-looter.webp female-01-debutant.webp female-05-debrouillard.webp female-10-chasseur.webp female-15-hustler.webp female-20-pro.webp female-30-elite.webp female-40-cyber-looter.webp female-50-rise-looter.webp)
          for f in "${files[@]}"; do test -s "$f" || { echo "Missing asset: $f"; exit 1; }; done
      - name: Detect one-time enhancement request
        id: detect
        shell: bash
        run: |
          if [ -f .asset-enhance-all ]; then echo 'run=true' >> "$GITHUB_OUTPUT"; else echo 'run=false' >> "$GITHUB_OUTPUT"; fi

  enhance:
    needs: prepare
    if: needs.prepare.outputs.enhance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        file:
          - 01-debutant.webp
          - 05-debrouillard.webp
          - 10-chasseur.webp
          - 15-hustler.webp
          - 20-pro.webp
          - 30-elite.webp
          - 40-cyber-looter.webp
          - 50-rise-looter.webp
          - female-01-debutant.webp
          - female-05-debrouillard.webp
          - female-10-chasseur.webp
          - female-15-hustler.webp
          - female-20-pro.webp
          - female-30-elite.webp
          - female-40-cyber-looter.webp
          - female-50-rise-looter.webp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install 4K restoration dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers webp
          wget -q https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip -O /tmp/realesrgan.zip
          unzip -q /tmp/realesrgan.zip -d /tmp/realesrgan
          chmod +x /tmp/realesrgan/realesrgan-ncnn-vulkan
      - name: Enhance one canonical asset to 3072x4096
        shell: bash
        env:
          FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          dims=$(webpinfo "$FILE" 2>/dev/null | awk '/Width:/ {w=$2} /Height:/ {h=$2} END {print w"x"h}')
          if [ "$dims" = "3072x4096" ]; then
            echo "Already 4K: $FILE"
          else
            base="${FILE%.webp}"
            dwebp "$FILE" -o "/tmp/${base}.png" >/dev/null
            /tmp/realesrgan/realesrgan-ncnn-vulkan -i "/tmp/${base}.png" -o "/tmp/${base}-4k.png" -n realesrgan-x4plus -s 4 -f png
            cwebp -quiet -q 100 -m 6 -sharp_yuv -resize 3072 4096 "/tmp/${base}-4k.png" -o "$FILE"
          fi
          final_dims=$(webpinfo "$FILE" 2>/dev/null | awk '/Width:/ {w=$2} /Height:/ {h=$2} END {print w"x"h}')
          echo "$FILE => $final_dims"
          [ "$final_dims" = "3072x4096" ] || { echo "Unexpected final dimensions: $final_dims"; exit 1; }
      - name: Checkpoint completed 4K asset
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.file }}
          path: ${{ matrix.file }}
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  publish:
    needs: [prepare, enhance]
    if: always() && needs.prepare.result == 'success' && (needs.prepare.outputs.enhance != 'true' || needs.enhance.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install publish verification dependencies
        if: needs.prepare.outputs.enhance == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
      - name: Download all completed 4K assets
        if: needs.prepare.outputs.enhance == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          path: .
          merge-multiple: true
      - name: Verify 16 final 4K assets
        if: needs.prepare.outputs.enhance == 'true'
        shell: bash
        run: |
          set -euo pipefail
          files=(01-debutant.webp 05-debrouillard.webp 10-chasseur.webp 15-hustler.webp 20-pro.webp 30-elite.webp 40-cyber-looter.webp 50-rise-looter.webp female-01-debutant.webp female-05-debrouillard.webp female-10-chasseur.webp female-15-hustler.webp female-20-pro.webp female-30-elite.webp female-40-cyber-looter.webp female-50-rise-looter.webp)
          for f in "${files[@]}"; do
            dims=$(webpinfo "$f" 2>/dev/null | awk '/Width:/ {w=$2} /Height:/ {h=$2} END {print w"x"h}')
            echo "$f => $dims"
            [ "$dims" = "3072x4096" ] || exit 1
          done
      - name: Commit all 16 4K masters at canonical paths
        if: needs.prepare.outputs.enhance == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .asset-enhance-all
          git add 01-debutant.webp 05-debrouillard.webp 10-chasseur.webp 15-hustler.webp 20-pro.webp 30-elite.webp 40-cyber-looter.webp 50-rise-looter.webp female-01-debutant.webp female-05-debrouillard.webp female-10-chasseur.webp female-15-hustler.webp female-20-pro.webp female-30-elite.webp female-40-cyber-looter.webp female-50-rise-looter.webp .asset-enhance-all
          if ! git diff --cached --quiet; then
            git commit -m 'Publish all 16 parallel 4K character masters [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Verify Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify > /tmp/userverify.json
          node -e "const d=require('/tmp/userverify.json'); process.exit(d.success?0:1)"
      - name: Deploy current workspace to Cloudflare
        id: deploy
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4 deploy > /tmp/wrangler-deploy.log 2>&1
          code=$?
          set -e
          sed -E 's/(cfut_|cfat_)[A-Za-z0-9_-]+/[REDACTED_TOKEN]/g' /tmp/wrangler-deploy.log | tail -n 160 > cloudflare-deploy-log.txt
          if [ "$code" -eq 0 ]; then echo 'outcome=success' >> "$GITHUB_OUTPUT"; else echo 'outcome=failure' >> "$GITHUB_OUTPUT"; fi
      - name: Record Cloudflare result
        if: always()
        env:
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          outcome='${{ steps.deploy.outputs.outcome }}'; [ -n "$outcome" ] || outcome='failure'
          printf 'status=%s\nsource_commit=%s\nstage_version=approved-reference-overnight\ncharacter_assets=16\nfinal_dimensions=3072x4096\ngender_silhouettes=auto\nrollback_source=disabled\n' "$outcome" "$TRIGGER_SHA" > cloudflare-deploy-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-deploy-status.txt
          if [ -f cloudflare-deploy-log.txt ]; then git add cloudflare-deploy-log.txt; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record Cloudflare deployment diagnostics [skip ci]'
            git stash push -u -m 'temporary publish workspace' >/dev/null || true
            git pull --rebase origin main
            git push origin HEAD:main
            git stash pop >/dev/null || true
          fi
      - name: Fail on Cloudflare deployment failure
        if: steps.deploy.outputs.outcome != 'success'
        run: exit 1
